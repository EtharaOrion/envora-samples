<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">envora - Boundary Weaver</title>
  <desc id="desc">A goddess joins floating repository islands with luminous interface threads. Her attendants are the ENGRAM memory lantern, the FORGE hammer, and the CRUCIBLE audit mirror. Reason across repositories. Respect every boundary.</desc>
  <metadata>Original code-native artwork for envora. Human-elected mascot: Boundary Weaver. ENGRAM: memory lantern. FORGE: forge hammer. CRUCIBLE: audit mirror. Preserve until human re-election.</metadata>
  <defs>
    <linearGradient id="night" x2=".8" y2="1"><stop stop-color="#07111d"/><stop offset=".48" stop-color="#112a36"/><stop offset="1" stop-color="#050c18"/></linearGradient>
    <radialGradient id="aurora"><stop stop-color="#88d4c3" stop-opacity=".34"/><stop offset=".45" stop-color="#65a9b7" stop-opacity=".12"/><stop offset="1" stop-color="#07111d" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop stop-color="#fff5d1"/><stop offset=".16" stop-color="#eec787" stop-opacity=".85"/><stop offset=".5" stop-color="#d8a66b" stop-opacity=".18"/><stop offset="1" stop-color="#d8a66b" stop-opacity="0"/></radialGradient>
    <linearGradient id="stone" x2=".7" y2="1"><stop stop-color="#487079"/><stop offset=".36" stop-color="#213d4d"/><stop offset="1" stop-color="#091523"/></linearGradient>
    <linearGradient id="top" x2="1" y2=".7"><stop stop-color="#567d81"/><stop offset="1" stop-color="#18303c"/></linearGradient>
