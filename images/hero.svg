    <linearGradient id="skin" x2="1" y2=".5"><stop stop-color="#f4d5ad"/><stop offset=".55" stop-color="#b68b78"/><stop offset="1" stop-color="#66596a"/></linearGradient>
    <linearGradient id="robe" x2="1" y2=".8"><stop stop-color="#93c8c0"/><stop offset=".26" stop-color="#4b8187"/><stop offset=".56" stop-color="#244755"/><stop offset=".8" stop-color="#1d334a"/><stop offset="1" stop-color="#587b83"/></linearGradient>
    <linearGradient id="veil" x2=".8" y2="1"><stop stop-color="#a8dad0" stop-opacity=".64"/><stop offset="1" stop-color="#24495a" stop-opacity=".08"/></linearGradient>
    <linearGradient id="mirror" x2="1" y2="1"><stop stop-color="#eff7df"/><stop offset=".25" stop-color="#8cb8b7"/><stop offset=".55" stop-color="#253e55"/><stop offset="1" stop-color="#729f9f"/></linearGradient>
