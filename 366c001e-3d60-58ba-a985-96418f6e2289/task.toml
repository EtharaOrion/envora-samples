schema_version = "1.4"

[task]
name = "ethara/envora-tidb-session-variable"
project_id = "Envora-001"
version = "1.0.0"

[metadata]
uuid = "366c001e-3d60-58ba-a985-96418f6e2289"
authors = [
    { name = "suryansh@ethara.ai" },
    { name = "sarvex@ethara.ai" },
    { name = "gurpreet.singh2037@ethara.ai" },
    { name = "navya.arora@ethara.ai" },
    { name = "supriya.verma@ethara.ai" },
    { name = "kanishk.singh@ethara.ai" },
    { name = "rahul.yadav@ethara.ai" },
    { name = "vinit.vani@ethara.ai" },
    { name = "saurav.kumar@ethara.ai" },
    { name = "deepanshu.agrawal40@ethara.ai" },
]
tags = [
  "crossrepo",
  "go",
  "source-level",
  "pingcap",
  "kvproto",
  "read-across-edit-one",
]
supported_platforms = [
  "linux/amd64",
  "linux/arm64",
]
difficulty = "medium"

[metadata.provenance]
target_repo = "pingcap/tidb"
external_repo = "pingcap/kvproto"
base_commit = "693e52cd51bd8565795ad9c650dd8ac743fc26fe"
pr_url = "https://github.com/pingcap/tidb/pull/68091"

[[repos]]
name = "kvproto"
url = "https://github.com/pingcap/kvproto.git"
commit = "a15c348f8713e5c492b6dfb41224c464b5824979"
path = "/workspace/kvproto"
editable_install = false
install_order = 0
sanitize_history = true

[[repos]]
name = "tidb"
url = "https://github.com/pingcap/tidb.git"
commit = "693e52cd51bd8565795ad9c650dd8ac743fc26fe"
path = "/workspace/tidb"
editable_install = true
install_order = 1
sanitize_history = true

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 20480
environment_form = "environment/Dockerfile"
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/envora@sha256:8c9ece68af722b552c52ca54ea4266f131fc9a25d2b536b493c1739b6a72ee11"
resolved_image_digest = "sha256:8c9ece68af722b552c52ca54ea4266f131fc9a25d2b536b493c1739b6a72ee11"
network_mode = "public"
build_timeout_sec = 3600.0

[agent]
timeout_sec = 10800.0
turn_budget = 600
max_turns = 600
network_mode = "allowlist"
allowed_hosts = [ "192.168.64.1",]

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"
# Network only for the judge API (provider from the config.json "judge" pin); the Go
# toolchain is offline. A gateway host set via *_BASE_URL must be listed in both allowlists.
network_mode = "allowlist"
allowed_hosts = [ "api.anthropic.com", "api.openai.com",]

[[verifier.collect]]
command = "tar -C / -czf /tmp/agent_workspace.tgz workspace"
service = "main"
timeout_sec = 600.0

[[artifacts]]
source = "/tmp/agent_workspace.tgz"
destination = "agent_workspace.tgz"

# Agent trajectory, optional evidence for the judge and process record (absent for the oracle).
[[artifacts]]
source = "/logs/agent/trajectory.json"
destination = "trajectory.json"

[verifier.environment]
# Prebuilt multi-arch verifier image; pin by @sha256 index digest after the push
# (aws ecr describe-images --repository-name envora --image-ids imageTag=366c001e-3d60-58ba-a985-96418f6e2289-verifier).
# tests/ is baked in: any change there means rebuild, push, re-pin.
docker_image = "426628337772.dkr.ecr.ap-south-1.amazonaws.com/envora@sha256:2dd55098540d072ba64071646064307e4f25be539e768872c7e4c2f1c6b26a26"
resolved_image_digest = "sha256:2dd55098540d072ba64071646064307e4f25be539e768872c7e4c2f1c6b26a26"
# Must match [verifier] above.
network_mode = "allowlist"
allowed_hosts = [ "api.anthropic.com", "api.openai.com",]
build_timeout_sec = 3600.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480

# Verifier env, resolved from the host environment at run time. Credentials/endpoint per
# provider; JUDGE_* are optional overrides of the config.json pin (empty = use the pin);
# any override is recorded in process.json judge.pin_overrides.
[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
JUDGE_SAMPLES = "${JUDGE_SAMPLES:-}"
JUDGE_PROVIDER = "${JUDGE_PROVIDER:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-}"
JUDGE_EFFORT = "${JUDGE_EFFORT:-}"
JUDGE_MAX_TOKENS = "${JUDGE_MAX_TOKENS:-}"
JUDGE_COUNCIL = "${JUDGE_COUNCIL:-}"
JUDGE_TIMEOUT_SEC = "${JUDGE_TIMEOUT_SEC:-}"
JUDGE_OPENAI_MAX_TOKENS_FIELD = "${JUDGE_OPENAI_MAX_TOKENS_FIELD:-}"

[verifier.site_runtime]
version = "3.1.0"
capabilities = []

[verifier.f2p_p2p]
per_repo = true

[[verifier.f2p_p2p.repo_tests]]
repo = "tidb"
test_patch = "tests/test.patch"
f2p_tests = [
  "pkg/store/copr/coprocessor_test.go::TestBuildCopTasksWithPagingSizeBytes",
  "pkg/store/copr/coprocessor_cache_test.go::TestBuildCacheKey",
  "pkg/store/copr/coprocessor_cache_test.go::TestGetSet",
  "pkg/store/copr/copr_test/coprocessor_test.go::TestBuildCopIteratorWithBatchStoreCopr",
  "pkg/distsql/request_builder_test.go::TestRequestBuilderKeepsPagingSizeBytesWhenPagingDisabled",
  "pkg/distsql/context/context_test.go::TestContextDetach",
]
p2p_tests = [
  "pkg/store/copr/coprocessor_test.go::TestBuildPagingTasksDisablePagingForSmallLimit",
  "pkg/distsql/request_builder_test.go::TestRequestBuilder1",
  "pkg/distsql/request_builder_test.go::TestRequestBuilder2",
]
