schema_version = "1.6"

[metadata]
uuid = "0aa40af6-f27f-4a2c-afda-d0ea4d0bc7e7"
authors = [
    { email = "suryansh@ethara.ai" },
    { email = "sarvex@ethara.ai" },
    { email = "gurpreet.singh2037@ethara.ai" },
    { email = "navya.arora@ethara.ai" },
    { email = "supriya.verma@ethara.ai" },
    { email = "kanishk.singh@ethara.ai" },
    { email = "rahul.yadav@ethara.ai" },
    { email = "vinit.vani@ethara.ai" },
    { email = "saurav.kumar@ethara.ai" },
    { email = "deepanshu.agrawal40@ethara.ai" },
]
tags = [
  "crossrepo",
  "go",
  "source-level",
  "pingcap",
  "kvproto",
  "read-across-edit-one",
]
supported_platforms = [
  "linux/amd64",
  "linux/arm64",
]
difficulty = "expert"

[metadata.provenance]
target_repo = "pingcap/tidb"
external_repo = "pingcap/kvproto"
base_commit = "693e52cd51bd8565795ad9c650dd8ac743fc26fe"
pr_url = "https://github.com/pingcap/tidb/pull/68091"

[[repos]]
name = "kvproto"
url = "https://github.com/pingcap/kvproto.git"
commit = "a15c348f8713e5c492b6dfb41224c464b5824979"
path = "kvproto"
editable_install = false
install_order = 0
sanitize_history = true

[[repos]]
name = "tidb"
url = "https://github.com/pingcap/tidb.git"
commit = "693e52cd51bd8565795ad9c650dd8ac743fc26fe"
path = "tidb"
editable_install = true
install_order = 1
sanitize_history = true

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 3600.0

[agent]
timeout_sec = 3600.0
turn_budget = 400
max_turns = 400

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.site_runtime]
version = "3.1.0"
capabilities = []

[verifier.f2p_p2p]
per_repo = true

[[verifier.f2p_p2p.repo_tests]]
repo = "tidb"
test_patch = "tests/test.patch"
f2p_tests = [
  "pkg/store/copr/coprocessor_test.go::TestBuildCopTasksWithPagingSizeBytes",
]
p2p_tests = [
  "pkg/store/copr/coprocessor_test.go::TestBuildPagingTasksDisablePagingForSmallLimit",
  "pkg/distsql/request_builder_test.go::TestRequestBuilder1",
  "pkg/distsql/request_builder_test.go::TestRequestBuilder2",
]
