schema_version = "1.6"

[metadata]
uuid = "0aa780ad-18f8-4351-8479-181363b32ea5"
authors = [
    { email = "suryansh@ethara.ai" },
    { email = "sarvex@ethara.ai" },
    { email = "gurpreet.singh2037@ethara.ai" },
    { email = "navya.arora@ethara.ai" },
    { email = "supriya.verma@ethara.ai" },
    { email = "kanishk.singh@ethara.ai" },
    { email = "rahul.yadav@ethara.ai" },
    { email = "vinit.vani@ethara.ai" },
    { email = "saurav.kumar@ethara.ai" },
    { email = "deepanshu.agrawal40@ethara.ai" },
]
tags = [
  "crossrepo",
  "go",
  "source-level",
  "tikv",
  "kvproto",
  "read-across-edit-one",
]
supported_platforms = [
  "linux/amd64",
  "linux/arm64",
]
difficulty = "easy"

[metadata.provenance]
target_repo = "tikv/pd"
external_repo = "pingcap/kvproto"
base_commit = "4ae1408fef038e2c41526556d83c9b7c0e98e021"
pr_url = "https://github.com/tikv/pd/pull/10911"

[[repos]]
name = "kvproto"
url = "https://github.com/pingcap/kvproto.git"
commit = "b41e86365ce0e0fba482005c0dfa5e2ca967d74c"
path = "kvproto"
editable_install = false
install_order = 0
sanitize_history = true

[[repos]]
name = "pd"
url = "https://github.com/tikv/pd.git"
commit = "4ae1408fef038e2c41526556d83c9b7c0e98e021"
path = "pd"
editable_install = true
install_order = 1
sanitize_history = true

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "no-network"
build_timeout_sec = 3600.0

[agent]
timeout_sec = 3600.0
turn_budget = 400
max_turns = 400

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.site_runtime]
version = "3.1.0"
capabilities = []

[verifier.f2p_p2p]
per_repo = true

[[verifier.f2p_p2p.repo_tests]]
repo = "pd"
test_patch = "tests/test.patch"
f2p_tests = [
  "client/keyspace_client_test.go::TestLoadKeyspaceByID",
  "client/keyspace_client_test.go::TestLoadKeyspaceByIDReturnsHeaderError",
  "client/keyspace_client_test.go::TestLoadKeyspaceByIDReturnsProtoClientError",
  "client/keyspace_client_test.go::TestLoadKeyspaceByIDReturnsRPCError",
]
p2p_tests = [
  "client/client_test.go::TestTSLessEqual",
  "client/client_test.go::TestIsRetryableGetTSError",
  "client/client_test.go::TestRoundUpDurationToSeconds",
  "client/client_test.go::TestSaturatingStdDurationFromSeconds",
  "client/client_test.go::TestIsKeyspaceUsingKeyspaceLevelGC",
]
